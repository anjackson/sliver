[project]
name = "sliver"
version = "0.0.2"
authors = [
  { name="Andy Jackson", email="anj@anjackson.net" },
]
description = "A sliver of a sliver."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
  "pywb",
  "cdxj-indexer",
  "wacz",
  "playwright==1.38.0",
  "typer==0.11.1",
  "setuptools==81.0.0", # Seems to be needed but not declared?
  "pyOpenSSL==25.0.0"  # Version 26.2.0 breaks the SSL proxy mode!
]

[project.scripts]
sliver = "sliver.cli:cli"

[project.urls]
Homepage = "https://github.com/anjackson/sliver"
Issues = "https://github.com/anjackson/sliver/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
